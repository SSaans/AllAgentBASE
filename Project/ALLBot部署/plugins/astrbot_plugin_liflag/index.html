<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习打卡 - 配置面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #333; }
        h2 { font-size: 18px; margin-bottom: 16px; color: #555; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        textarea { min-height: 100px; font-family: monospace; resize: vertical; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .admin-list { margin-top: 16px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8f9fa; border-radius: 4px; margin-bottom: 8px; }
        .admin-qq { font-weight: 500; color: #333; }
        .admin-time { font-size: 12px; color: #888; margin-left: 12px; }
        .admin-actions { display: flex; gap: 8px; }
        .add-admin-form { display: flex; gap: 10px; margin-top: 12px; }
        .add-admin-form input { flex: 1; }
        .super-admin-badge { display: inline-block; padding: 4px 8px; background: #ffc107; color: #333; border-radius: 4px; font-size: 12px; font-weight: 500; margin-left: 8px; }
        .message { padding: 12px; border-radius: 4px; margin-bottom: 16px; display: none; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .help-text { font-size: 12px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>学习打卡 - 配置面板</h1>

        <div class="card">
            <h2>管理员管理</h2>
            <div id="admin-message" class="message"></div>

            <div class="form-group">
                <label>超级管理员 QQ</label>
                <input type="text" id="super_admin" placeholder="默认: 2403232967">
                <div class="help-text">超级管理员拥有所有权限，包括增删普通管理员</div>
            </div>

            <div class="admin-list">
                <label>普通管理员列表</label>
                <div id="admins-container"></div>

                <div class="add-admin-form">
                    <input type="text" id="new-admin-qq" placeholder="输入QQ号">
                    <button class="btn btn-success" onclick="addAdmin()">添加管理员</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>基础配置</h2>
            <div id="config-message" class="message"></div>

            <div class="form-group">
                <label>管理员数量上限</label>
                <input type="number" id="admin_limit" value="20" min="1" max="100">
            </div>

            <div class="form-group">
                <label>关键词别名映射</label>
                <textarea id="keyword_alias" placeholder="例如：py => Python&#10;js => JavaScript"></textarea>
                <div class="help-text">格式：别名 => 正式名称，每行一个</div>
            </div>

            <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
        </div>
    </div>

    <script>
        let currentConfig = {};

        async function loadConfig() {
            try {
                const res = await fetch('/api/astrbot_plugin_liflag/config');
                const data = await res.json();
                currentConfig = data;

                document.getElementById('super_admin').value = data.super_admin || '2403232967';
                document.getElementById('admin_limit').value = data.admin_limit || 20;
                document.getElementById('keyword_alias').value = data.keyword_alias || '';
            } catch (e) {
                showMessage('config-message', 'error', '加载配置失败: ' + e.message);
            }
        }

        async function loadAdmins() {
            try {
                const res = await fetch('/api/astrbot_plugin_liflag/admins');
                const data = await res.json();

                const container = document.getElementById('admins-container');
                if (data.admins.length === 0) {
                    container.innerHTML = '<div style="color: #888; padding: 12px;">暂无普通管理员</div>';
                } else {
                    container.innerHTML = data.admins.map(admin => {
                        const time = new Date(admin.added_at * 1000).toLocaleString('zh-CN');
                        return `
                            <div class="admin-item">
                                <div>
                                    <span class="admin-qq">${admin.qq}</span>
                                    <span class="admin-time">添加于 ${time}</span>
                                </div>
                                <div class="admin-actions">
                                    <button class="btn btn-danger btn-sm" onclick="removeAdmin('${admin.qq}')">删除</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (e) {
                showMessage('admin-message', 'error', '加载管理员列表失败: ' + e.message);
            }
        }

        async function addAdmin() {
            const qq = document.getElementById('new-admin-qq').value.trim();
            if (!qq) {
                showMessage('admin-message', 'error', '请输入QQ号');
                return;
            }
            if (!/^\d+$/.test(qq)) {
                showMessage('admin-message', 'error', 'QQ号格式错误');
                return;
            }

            try {
                const res = await fetch('/api/astrbot_plugin_liflag/admins/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qq })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('admin-message', 'success', data.message);
                    document.getElementById('new-admin-qq').value = '';
                    loadAdmins();
                } else {
                    showMessage('admin-message', 'error', data.message || '添加失败');
                }
            } catch (e) {
                showMessage('admin-message', 'error', '添加管理员失败: ' + e.message);
            }
        }

        async function removeAdmin(qq) {
            if (!confirm(`确定要删除管理员 ${qq} 吗？`)) return;

            try {
                const res = await fetch('/api/astrbot_plugin_liflag/admins/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qq })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('admin-message', 'success', data.message);
                    loadAdmins();
                } else {
                    showMessage('admin-message', 'error', data.message || '删除失败');
                }
            } catch (e) {
                showMessage('admin-message', 'error', '删除管理员失败: ' + e.message);
            }
        }

        async function saveConfig() {
            const config = {
                ...currentConfig,
                super_admin: document.getElementById('super_admin').value.trim(),
                admin_limit: parseInt(document.getElementById('admin_limit').value),
                keyword_alias: document.getElementById('keyword_alias').value
            };

            try {
                const res = await fetch('/api/astrbot_plugin_liflag/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('config-message', 'success', '配置保存成功');
                    currentConfig = config;
                } else {
                    showMessage('config-message', 'error', data.message || '保存失败');
                }
            } catch (e) {
                showMessage('config-message', 'error', '保存配置失败: ' + e.message);
            }
        }

        function showMessage(id, type, text) {
            const el = document.getElementById(id);
            el.className = `message ${type}`;
            el.textContent = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        window.onload = () => {
            loadConfig();
            loadAdmins();
        };
    </script>
</body>
</html>
