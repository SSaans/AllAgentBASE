<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Book icon -->
  <rect x="35" y="40" width="58" height="48" rx="4" fill="white" opacity="0.9"/>
  <line x1="64" y1="40" x2="64" y2="88" stroke="#3b82f6" stroke-width="2"/>
  <line x1="35" y1="52" x2="93" y2="52" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="35" y1="60" x2="93" y2="60" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="35" y1="68" x2="93" y2="68" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="35" y1="76" x2="93" y2="76" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>

  <!-- Clock overlay -->
  <circle cx="84" cy="78" r="16" fill="white"/>
  <circle cx="84" cy="78" r="14" fill="none" stroke="#10b981" stroke-width="2"/>
  <line x1="84" y1="78" x2="84" y2="70" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="78" x2="89" y2="78" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>
